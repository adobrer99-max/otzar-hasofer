<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- `viewport-fit=cover` so the game can run to the edges of a notched
         phone. It is only half the change: without the safe-area insets that
         go with it (see `GameCanvas.module.css` and `GamePage.module.css`) the
         touch pad sits under the home indicator, which is the gesture bar —
         every jump becomes a coin flip between leaping and leaving the app. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#14171c" />
    <meta name="description" content="Otzar Ha'Sofer — the Treasury: a digital companion and reference guide for the Scribe's reading, including the Herald generator." />
    <title>Otzar Ha'Sofer — The Treasury</title>
    <script>
      // Set the theme before first paint so there is no flash. Saved choice
      // wins; otherwise follow the OS preference. Default is the charcoal dark.
      (function () {
        try {
          var saved = localStorage.getItem("otzar-theme");
          var prefersLight =
            window.matchMedia &&
            window.matchMedia("(prefers-color-scheme: light)").matches;
          var theme = saved || (prefersLight ? "light" : "dark");
          document.documentElement.setAttribute("data-theme", theme);
          var meta = document.querySelector('meta[name="theme-color"]');
          if (meta) meta.setAttribute("content", theme === "light" ? "#f4efe2" : "#14171c");
        } catch (e) {
          document.documentElement.setAttribute("data-theme", "dark");
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
